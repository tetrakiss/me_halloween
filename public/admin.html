<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Монстрополия — админка</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css?v=20260928-17" />
<script src="platform-sdk.js?v=20260927-8"></script>
<script src="towers-config.js"></script>
<style>
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); }
  select, input { width: auto; display: inline-block; }
  .admin-collapsible > summary { display: flex; align-items: center; gap: 12px; cursor: pointer; list-style: none; font-weight: 600; min-height: 44px; }
  .admin-collapsible > summary::-webkit-details-marker { display: none; }
  .admin-collapsible > summary::after { content: '⌄'; margin-left: auto; font-size: 24px; }
  .admin-collapsible[open] > summary::after { transform: rotate(180deg); }
  .admin-collapsible > summary > div { flex: 1; margin-bottom: 0; border-bottom: 0; padding-bottom: 0; }
  .admin-section-content { padding-top: 16px; }
  .admin-collapsible > summary:focus-visible { outline: 2px solid var(--muted); outline-offset: 4px; }
  .member-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px 12px; }
  .member-wish { color: var(--muted); }
  .group-members .member-wish-missing { color: #f4b75e; }
  .host-visits-card { margin-top: 12px; padding: 12px; border: 1px solid var(--border); border-radius: 12px; }
  .host-visits-card > summary { cursor: pointer; font-weight: 600; padding: 8px 0; }
  .host-visits-card select { width: 100%; margin: 6px 0 10px; }
  .host-filter-primary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 640px) { .host-filter-primary { grid-template-columns: 1fr; } }
</style>
<link rel="stylesheet" href="admin-redesign.css?v=1.0.43" />
</head>
<body class="admin-page">
  <div class="header"><span class="brand-mark" aria-hidden="true">🦇</span><span class="brand-copy"><small>HALLOWEEN BOT</small><h1>Панель управления</h1></span></div>
  <div id="app"></div>
  <script src="admin.js?v=1.1.0"></script>
</body>
</html>
